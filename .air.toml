root = "."
tmp_dir = "storage/temp"

[build]
pre_cmd = []
cmd = "go build -o storage/temp/main ./cmd/app"
post_cmd = []
bin = "storage/temp/main"
full_bin = ""
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["storage", "web"]
include_dir = []
include_file = []
exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = true
log = "build-errors.log"
delay = 2000
stop_on_error = true
send_interrupt = false
kill_delay = 500 # nanosecond
rerun = true
rerun_delay = 500

[log]
time = false
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
