name: Deploy Frontend
run-name: Deploy the web

# Builds web/ and syncs dist/ into $WEB_ROOT, which the web server serves, then checks that
# version.json reports the deployed commit.
#
# Repository variables:
#   API_URL       baked in as VITE_API_URL, default https://weavatar.com/api
#   WEB_ROOT      absolute path on the server, default /opt/ace/sites/weavatar/public
#   WEB_URL       public site URL for the smoke test, default https://weavatar.com
# Repository secrets: DEPLOY_HOST, DEPLOY_USER (can write WEB_ROOT and sudo chown), DEPLOY_SSH_KEY.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: ${{ vars.API_URL || 'https://weavatar.com/api' }}
      WEB_ROOT: ${{ vars.WEB_ROOT || '/opt/ace/sites/weavatar/public' }}
      WEB_URL: ${{ vars.WEB_URL || 'https://weavatar.com' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Check configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing deployment configuration: ${missing[*]}"
            exit 1
          fi
          [[ "$WEB_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::WEB_ROOT must be an absolute path"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          # self-hosted runner images may lack rsync, an SSH client or jq
          if ! command -v rsync >/dev/null || ! command -v ssh >/dev/null || ! command -v jq >/dev/null; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends rsync openssh-client jq
          fi

      - name: Setup web
        uses: ./.github/actions/setup-web

      - name: Build
        working-directory: web
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: pnpm build-only

      - name: Identify the release
        id: release
        run: |
          release="$(git rev-parse --short HEAD)"
          # vite.config.ts writes the same short hash into version.json, which the smoke test reads
          jq -e --arg hash "$release" '.hash == $hash' web/dist/version.json
          echo "hash=$release" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 10
          EOF

      - name: Upload
        run: |
          # shellcheck disable=SC2029 # variables are meant to expand locally before ssh
          ssh deploy-target "install -d '$WEB_ROOT'"
          # files are renamed into place together at the end, so index.html never points at
          # assets that have not arrived
          for attempt in 1 2 3; do
            if rsync -az --delete-delay --delay-updates --timeout=60 web/dist/ "deploy-target:$WEB_ROOT/"; then
              # shellcheck disable=SC2029
              ssh deploy-target "sudo chown -R www:www '$WEB_ROOT'"
              exit 0
            fi
            [ "$attempt" -eq 3 ] && { echo "upload failed after 3 attempts" >&2; exit 1; }
            sleep $((attempt * 3))
          done

      - name: Smoke test
        env:
          RELEASE: ${{ steps.release.outputs.hash }}
        run: |
          for _ in 1 2 3 4 5; do
            if curl -fsS "$WEB_URL/version.json?smoke=$(date +%s)" | jq -e --arg hash "$RELEASE" '.hash == $hash'; then
              curl -fsS -o /dev/null "$WEB_URL/"
              exit 0
            fi
            sleep 3
          done
          echo "::error::$WEB_URL does not serve release $RELEASE"
          exit 1
