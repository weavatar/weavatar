name: Lint

on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          scope: lint

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # build with the job's Go so the linter understands the go.mod version
          install-mode: goinstall
          version: latest
          args: --timeout=30m ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          scope: vuln

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
