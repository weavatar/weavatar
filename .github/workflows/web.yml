name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/web.yml
      - .github/actions/setup-web/**
  pull_request:
    paths:
      - web/**
      - .github/workflows/web.yml
      - .github/actions/setup-web/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup web
        uses: ./.github/actions/setup-web

      - name: Lint
        # the lint script runs eslint --fix, so fail when it rewrote committed files
        run: |
          pnpm lint
          git diff --exit-code -- .

      - name: Type-check
        run: pnpm type-check

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup web
        uses: ./.github/actions/setup-web

      - name: Test
        run: pnpm test:unit --run

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup web
        uses: ./.github/actions/setup-web

      - name: Build
        run: pnpm build-only

      - name: Check version.json
        # the deploy smoke test relies on vite.config.ts writing the git short hash
        run: node -e 'const v = require("./dist/version.json"); if (v.hash !== process.argv[1]) { console.error("version.json hash mismatch:", v.hash); process.exit(1) }' "$(git rev-parse --short HEAD)"
