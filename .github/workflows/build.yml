name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          # One build cache per architecture; deploy-backend reuses build-amd64.
          scope: build-${{ matrix.goarch }}

      - name: Build ${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always)
          LDFLAGS="-s -w -X main.version=${VERSION} --extldflags '-static'"
          go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o app-${{ matrix.goarch }} ./cmd/app
          go build -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o cli-${{ matrix.goarch }} ./cmd/cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goarch }}
          path: |
            app-${{ matrix.goarch }}
            cli-${{ matrix.goarch }}
