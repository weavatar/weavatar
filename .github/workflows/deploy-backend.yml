name: Deploy Backend
run-name: Deploy the API

# Builds bin/app and bin/cli, uploads them over SSH, migrates, swaps the binaries, reloads the
# Type=notify-reload unit without downtime and probes /healthz and /readyz. A failed reload or
# probe rolls the binaries back; migrations stay, so they must be backward compatible.
#
# Repository variables (optional) and secrets:
#   vars    API_DIR         install directory, default /opt/ace/projects/weavatar
#           API_PORT        local listen port, default 3100
#           SERVICE_NAME    systemd unit, default weavatar
#   secrets DEPLOY_HOST     SSH host
#           DEPLOY_USER     root, or a user that can write API_DIR and run sudo -u www,
#                           sudo chown, systemctl and journalctl without a password
#           DEPLOY_SSH_KEY  private key for DEPLOY_USER
#
# The server needs rsync, curl, sha256sum, a www user, $API_DIR/config/config.yml,
# $API_DIR/storage owned by www, and a unit running $API_DIR/app as www with
# WorkingDirectory=$API_DIR and Environment=APP_CONFIG=$API_DIR/config/config.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ github.sha }}
      API_DIR: ${{ vars.API_DIR || '/opt/ace/projects/weavatar' }}
      API_PORT: ${{ vars.API_PORT || '3100' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'weavatar' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Check configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing deployment configuration: ${missing[*]}"
            exit 1
          fi
          [[ "$API_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::API_DIR must be an absolute path"; exit 1; }
          [[ "$API_PORT" =~ ^[0-9]+$ ]] || { echo "::error::API_PORT must be a number"; exit 1; }
          [[ "$SERVICE_NAME" =~ ^[A-Za-z0-9@._-]+$ ]] || { echo "::error::SERVICE_NAME is not a valid unit name"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          scope: build-amd64

      - name: Build
        run: |
          make build
          {
            echo "APP_SHA256=$(sha256sum bin/app | cut -d' ' -f1)"
            echo "CLI_SHA256=$(sha256sum bin/cli | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # Self-hosted runner images may lack rsync or ssh.
          if ! command -v rsync >/dev/null || ! command -v ssh >/dev/null; then
            SUDO=""
            [ "$(id -u)" -eq 0 ] || SUDO=sudo
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends rsync openssh-client
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 10
          EOF

      - name: Upload
        run: |
          # Seed app.new/cli.new from the running binaries so rsync only sends the delta.
          # shellcheck disable=SC2029 # variables are meant to expand locally before ssh
          ssh deploy-target "set -e
            install -d '$API_DIR/config' '$API_DIR/scripts'
            cd '$API_DIR'
            if [ -f app ]; then cp -f app app.new; else : > app.new; fi
            if [ -f cli ]; then cp -f cli cli.new; else : > cli.new; fi"
          RSYNC=(rsync --partial --inplace --no-whole-file --ignore-times -z --timeout=60)
          for attempt in 1 2 3; do
            if "${RSYNC[@]}" bin/app "deploy-target:$API_DIR/app.new" &&
               "${RSYNC[@]}" bin/cli "deploy-target:$API_DIR/cli.new" &&
               rsync --timeout=30 config/config.example.yml "deploy-target:$API_DIR/config/config.example.yml" &&
               rsync --timeout=30 deploy/scripts/*.sh "deploy-target:$API_DIR/scripts/"; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && { echo "upload failed after 3 attempts" >&2; exit 1; }
            sleep $((attempt * 3))
          done

      - name: Migrate, reload and probe
        run: |
          remote_env="$(printf 'APP_VERSION=%q API_DIR=%q API_PORT=%q SERVICE_NAME=%q APP_SHA256=%q CLI_SHA256=%q' \
            "$APP_VERSION" "$API_DIR" "$API_PORT" "$SERVICE_NAME" "$APP_SHA256" "$CLI_SHA256")"
          # shellcheck disable=SC2029 # variables are meant to expand locally before ssh
          ssh deploy-target "$remote_env bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$API_DIR"
          echo "$APP_SHA256  app.new" | sha256sum -c -
          echo "$CLI_SHA256  cli.new" | sha256sum -c -
          # www runs cli.new below, whatever the deploy user's umask
          chmod 755 app.new cli.new scripts/probe.sh scripts/rollback.sh

          export APP_CONFIG="$API_DIR/config/config.yml"
          if [ ! -f "$APP_CONFIG" ]; then
            echo "missing $APP_CONFIG; copy config/config.example.yml there and fill it in first" >&2
            exit 1
          fi
          if [ ! -d storage ]; then
            echo "missing $API_DIR/storage; create it owned by www first" >&2
            exit 1
          fi

          # As www, so logs the CLI writes under storage/ stay owned by the service user.
          migrate() { sudo -u www env APP_CONFIG="$APP_CONFIG" ./cli.new migrate "$@"; }
          migrate status
          migrate plan
          migrate up

          # Chown only what this deploy wrote; storage/ stays as server setup left it.
          owned=(app cli VERSION config/config.example.yml)
          for f in app cli VERSION; do
            if [ -f "$f" ]; then cp -f "$f" "$f.prev"; owned+=("$f.prev"); fi
          done
          mv -f app.new app
          mv -f cli.new cli
          printf '%s\n' "$APP_VERSION" > VERSION
          sudo chown -h www:www "${owned[@]}"
          sudo chown -R www:www scripts

          # reload returns once the new binary reports ready, but it becomes MainPID only after
          # the old one exits, so wait for the PID to move. A stopped unit is started instead.
          old_pid="$(systemctl show -p MainPID --value "$SERVICE_NAME")"
          new_pid="$old_pid"
          if sudo systemctl reload-or-restart "$SERVICE_NAME"; then
            for _ in $(seq 1 60); do
              new_pid="$(systemctl show -p MainPID --value "$SERVICE_NAME")"
              if [ "$new_pid" != 0 ] && [ "$new_pid" != "$old_pid" ]; then break; fi
              sleep 0.5
            done
          fi
          if [ "$new_pid" = 0 ] || [ "$new_pid" = "$old_pid" ] ||
             ! scripts/probe.sh "http://127.0.0.1:$API_PORT"; then
            sudo systemctl status "$SERVICE_NAME" --no-pager || true
            sudo journalctl -u "$SERVICE_NAME" -n 100 --no-pager || true
            if scripts/rollback.sh "$API_DIR" "$SERVICE_NAME"; then
              scripts/probe.sh "http://127.0.0.1:$API_PORT" 15 || echo "the rolled back binary is not healthy either" >&2
            fi
            exit 1
          fi
          REMOTE
