name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go and caches
        uses: ./.github/actions/setup-go
        with:
          scope: test

      - name: Verify Wire output
        run: go tool wire check ./...

      - name: Run tests
        run: go test -v -race -coverprofile="coverage.out" ./...

      - name: Verify generator output
        run: make gen-check
