name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          scope: test

      - name: Check Wire output
        run: make wire-check

      - name: Test
        run: make test

      - name: Check generator output
        run: make gen-check
