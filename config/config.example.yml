app:
  name: "weavatar"
  # 32 字节：openssl rand -base64 24 | head -c 32
  key: "a-long-string-with-32-characters"
  locale: "zh_Hans"
  # 调试模式跳过极验校验，生产必须关闭
  debug: true
http:
  debug: true
  address: ":3000"
  domain: "weavatar.com"
  # pprof/expvar 私有端口，如 "127.0.0.1:6060"
  debug_address: ""
  cors_origins: ["*"]
  # 经 nginx 时填 "X-Real-IP"，限流按客户端 IP 计数
  proxy_header: ""
  docs: true
  body_limit: 4096 # KB
  header_limit: 4096 # bytes
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "60s"
  reduce_memory_usage: false
log:
  level: "debug" # debug | info | warn | error
  output: "both" # file | stderr | both
  path: "storage/logs/app.log"
database:
  debug: true
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/weavatar?sslmode=disable"
  max_open_conns: 0
  max_idle_conns: 0
  conn_max_lifetime: "0s"
hash:
  dir: "storage/hash"
# Gravatar 源站或其镜像，需服务器可达
gravatar:
  url: "https://gravatar.com"
mail:
  host: "smtp.example.com"
  port: 587
  user: "noreply@example.com"
  password: ""
